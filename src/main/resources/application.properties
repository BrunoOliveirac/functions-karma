spring.application.name=karma
spring.profiles.default=development

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# In-memory request limits. trusted-proxies may be hostnames (panel-karma) or IP literals.
karma.rate-limit.login-per-minute=10
karma.rate-limit.register-per-hour=5
karma.rate-limit.authenticated-per-minute=120
karma.rate-limit.anonymous-per-minute=300
